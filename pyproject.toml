[project]
name = "update-artifacts-lockfile"
version = "0.1.0"
description = "A post-upgrade task script that updates checksums in an artifacts lockfile"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "ruamel.yaml>=0.18.0",
]

[project.scripts]
update_artifacts_lockfile = "update_artifacts_lockfile:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

